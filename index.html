<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHMade®</title>
<style>
  :root {
    --bg-color: #f4f4f4;
    --text-main: #0f141e;
    --text-active: #c5b399;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    /* ADD YOUR MAIN BACKGROUND IMAGE URL HERE */
    background: url('YOUR_BACKGROUND_IMAGE.jpg') no-repeat center center fixed; 
    background-size: cover;
    background-color: #8c8378; /* Fallback color */
  }

  .card {
    background-color: var(--bg-color);
    width: 85vw;
    height: 85vh;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    overflow: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    padding: 2rem 3rem;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-main);
    z-index: 10;
  }

  .nav-links span {
    margin-left: 2rem;
    cursor: pointer;
  }

  .main-content {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  ul.destinations {
    list-style: none;
    padding: 0;
    margin: 0;
    text-align: center;
    z-index: 1;
  }

  ul.destinations li {
    font-size: 4.5rem; /* Adjust based on preference */
    letter-spacing: -0.05em;
    line-height: 1.1;
    color: var(--text-main);
    white-space: nowrap;
  }

  ul.destinations li.active {
    color: var(--text-active);
  }

  .center-image-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 450px;
    z-index: 5;
    /* ADD YOUR CENTER IMAGE URL HERE */
    background: url('YOUR_CENTER_IMAGE.jpg') center/cover;
    background-color: #d3d3d3; /* Placeholder color before you add image */
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  /* Basic responsiveness */
  @media (max-width: 1024px) {
    ul.destinations li { font-size: 3.5rem; }
  }
  @media (max-width: 768px) {
    ul.destinations li { font-size: 2rem; }
    .center-image-container { width: 200px; height: 300px; }
    header { padding: 1.5rem; }
  }
</style>
</head>
<body>

  <div class="card">
    <header>
      <div class="logo">CHMade®</div>
      <div class="nav-links">
        <span>Profile</span>
        <span>More</span>
      </div>
    </header>

    <main class="main-content">
      <ul class="destinations">
        <li>Taiwan, Changhua, Tianzhong</li>
        <li>Marketing</li>
        <li>Film</li>
        <li class="active">Graphic Design</li>
        <li>Post-Rock</li>
        <li>Plain Tea but with Boba</li>
        <li>Photography</li>
        <li>196 cm tall</li>
      </ul>

      <div class="center-image-container"></div>
    </main>
  </div>

</body>
</html>
